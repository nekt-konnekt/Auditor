name: Verify Auditor

on:
  push:
    branches:
      - main
      - audit/security-and-deploy-readiness
      - upgrade/persistence-and-readiness-checks
      - integration/vercel-neon-ready
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run lint
      - name: Regression tests
        run: bun run test
      - name: Build
        run: bun run build
